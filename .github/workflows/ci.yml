name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # PostgreSQL para las pruebas del servidor (apps/server); con CI=true fallan si no hay base.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cronos
          POSTGRES_PASSWORD: cronos
          POSTGRES_DB: cronos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cronos" --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cronos:cronos@localhost:5432/cronos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # core con cobertura (≥ 85 % de líneas, NF-12); el resto de proyectos sin cobertura
      - run: pnpm test:coverage
      - run: pnpm exec vitest run --project engine --project workers --project api --project web --project server
      - run: pnpm --filter @cronos/server build
      # ponytail: los umbrales de tiempo dependen de la máquina; en CI solo informan
      - run: pnpm test:perf
        continue-on-error: true
