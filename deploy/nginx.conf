server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets con hash de Vite: caché larga
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API (perfil `server`): mismo origen, así la cookie de sesión no necesita CORS. La variable
  # difiere la resolución de `api`: sin el perfil activo, nginx arranca igual y /api responde 502.
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # IP del cliente que fija Traefik: la usa el límite de intentos de inicio de sesión.
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 50m;
    add_header Cache-Control "no-store";
  }

  # Assets de topografía (D-16): binarios de hasta 200 MB, inmutables (su URL lleva el hash), así
  # que el navegador los guarda; la API decide el Cache-Control.
  location ~ ^/api/mines/[^/]+/assets/ {
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 200m;
    proxy_request_buffering off;
  }

  # Salas de presentación en VR (D-19): WebSocket de larga duración (Traefik ya lo deja pasar).
  location ~ ^/api/rooms/ {
    resolver 127.0.0.11 valid=30s;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 1h;
  }

  # SPA: el index nunca se cachea
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
